<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">A Window on Tempo, from tap to payout</title><desc id="description">Your passkey or a capped key signs; ops keeps the clock and the prints moving; the engine decides and pays. Three rows of four connected stages. Each stage's authority boundary is in the interactive documentation.</desc>
<defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#E04D26"/></marker></defs>
<style>.background{fill:#050505}.node{fill:#0A0A0A;stroke:#262626;stroke-width:2}.heading,.title{font-family:Arial,sans-serif;fill:#FFFFFF;font-weight:700}.heading{font-size:36px}.title{font-size:22px}.sub{font:16px Arial,sans-serif;fill:#A3A3A3}.num,.row{font:700 15px Arial,sans-serif;fill:#E04D26}.arrow{stroke:#E04D26;stroke-width:2.5}.arrow-label{font:12px Arial,sans-serif;fill:#A3A3A3}.footer{font:14px Arial,sans-serif;fill:#A3A3A3}</style>
<rect width="1400" height="1010" class="background"/>
<text x="32" y="66" class="heading">A Window on Tempo, from tap to payout</text>
<text x="32" y="101" class="sub">Your passkey or a capped key signs; ops keeps the clock and the prints moving; the engine decides and pays.</text>
<path d="M32 123H1368" stroke="#262626" stroke-width="2"/>
<text x="32" y="183" class="row">01 · Your account</text><g><rect x="32" y="200" width="308" height="152" rx="15" class="node"/><text x="52" y="227" class="num">1.1</text><text class="title" x="52" y="266">Passkey account</text><text class="sub" x="52" y="320">WebAuthn, verified by Tempo</text></g><g><rect x="382" y="200" width="308" height="152" rx="15" class="node"/><text x="402" y="227" class="num">1.2</text><text class="title" x="402" y="266">One-tap key or grant</text><text class="sub" x="402" y="320">Access key · Trading Balance</text><text class="sub" x="402" y="338">SESSION</text></g><g><rect x="732" y="200" width="308" height="152" rx="15" class="node"/><text x="752" y="227" class="num">1.3</text><text class="title" x="752" y="266">The relay</text><text class="sub" x="752" y="320">/api/relay, fee sponsorship</text></g><g><rect x="1082" y="200" width="308" height="152" rx="15" class="node"/><text x="1102" y="227" class="num">1.4</text><text class="title" x="1102" y="266">EventsEngine</text><text class="sub" x="1102" y="320">placeOrder, immediate-or-cancel</text></g><path d="M342 276h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="379" class="arrow-label" text-anchor="middle">signed tap</text><path d="M692 276h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="379" class="arrow-label" text-anchor="middle">sponsored tx</text><path d="M1042 276h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="379" class="arrow-label" text-anchor="middle">IOC order</text><text x="32" y="418" class="row">02 · Venue operation</text><g><rect x="32" y="435" width="308" height="152" rx="15" class="node"/><text x="52" y="462" class="num">2.1</text><text class="title" x="52" y="501">Window roller</text><text class="sub" x="52" y="555">66 series, one clock</text></g><g><rect x="382" y="435" width="308" height="152" rx="15" class="node"/><text x="402" y="462" class="num">2.2</text><text class="title" x="402" y="501">Price relay</text><text class="sub" x="402" y="555">RedStone packages on chain</text></g><g><rect x="732" y="435" width="308" height="152" rx="15" class="node"/><text x="752" y="462" class="num">2.3</text><text class="title" x="752" y="501">Print verifier</text><text class="sub" x="752" y="555">3 of 5 signers, near the boundary</text></g><g><rect x="1082" y="435" width="308" height="152" rx="15" class="node"/><text x="1102" y="462" class="num">2.4</text><text class="title" x="1102" y="501">Settler</text><text class="sub" x="1102" y="555">settle · void · redeemFor</text></g><path d="M342 511h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="614" class="arrow-label" text-anchor="middle">open Window</text><path d="M692 511h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="614" class="arrow-label" text-anchor="middle">signed packages</text><path d="M1042 511h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="614" class="arrow-label" text-anchor="middle">recorded prints</text><text x="32" y="653" class="row">03 · Read and prove</text><g><rect x="32" y="670" width="308" height="152" rx="15" class="node"/><text x="52" y="697" class="num">3.1</text><text class="title" x="52" y="736">Indexer</text><text class="sub" x="52" y="790">Engine, vaults, strategies</text></g><g><rect x="382" y="670" width="308" height="152" rx="15" class="node"/><text x="402" y="697" class="num">3.2</text><text class="title" x="402" y="736">Recount</text><text class="sub" x="402" y="790">Replay against the index</text></g><g><rect x="732" y="670" width="308" height="152" rx="15" class="node"/><text x="752" y="697" class="num">3.3</text><text class="title" x="752" y="736">The app's reads</text><text class="sub" x="752" y="790">Index, EngineLens, the stream</text></g><g><rect x="1082" y="670" width="308" height="152" rx="15" class="node"/><text x="1102" y="697" class="num">3.4</text><text class="title" x="1102" y="736">Proof page</text><text class="sub" x="1102" y="790">Re-verify in your browser</text></g><path d="M342 746h31" class="arrow" marker-end="url(#tip)"/><text x="355" y="849" class="arrow-label" text-anchor="middle">events</text><path d="M692 746h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="849" class="arrow-label" text-anchor="middle">checked totals</text><path d="M1042 746h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="849" class="arrow-label" text-anchor="middle">display</text>
