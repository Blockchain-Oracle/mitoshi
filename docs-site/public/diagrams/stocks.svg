<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">Stocks on Tempo</title><desc id="description">Robinhood Stock Tokens locked on their chain, mirrored on Tempo, traded in guarded pools and themed baskets. Three rows of four connected stages. Each stage's authority boundary is in the interactive documentation.</desc>
