<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heading description" viewBox="0 0 1400 1010">
<title id="heading">Exits that run with the app closed</title><desc id="description">You grant a sell-only permission once; the keeper decides when; the vault decides the lowest price. Three rows of four connected stages. Each stage's authority boundary is in the interactive documentation.</desc>
