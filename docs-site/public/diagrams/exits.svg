quotes</text><path d="M692 746h31" class="arrow" marker-end="url(#tip)"/><text x="705" y="849" class="arrow-label" text-anchor="middle">depth</text><path d="M1042 746h31" class="arrow" marker-end="url(#tip)"/><text x="1055" y="849" class="arrow-label" text-anchor="middle">settle</text>
