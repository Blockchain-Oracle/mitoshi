<!doctype html>
<!-- Google Play's feature graphic, 1024 × 500 (D-227, MOBILE): the site's link-preview card (web/src/features/og —
     OgFrame's ground, crop marks, wordmark, eyebrow and honesty line, siteImage's headline and three marks) redrawn at
     Play's size. Rendered by mobile/scripts/store-assets.mjs, which inlines the vendored Sora SemiBold as the font source. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Sora"; src: url(__SORA__) format("truetype"); font-weight: 600; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1024px; height: 500px; background: #050505; overflow: hidden; }
  .frame { position: relative; display: flex; flex-direction: column; width: 1024px; height: 500px; padding: 52px 60px; color: #FFFFFF; font-family: "Sora"; font-weight: 600; }
  .crop { position: absolute; width: 22px; height: 22px; border: 0 solid rgba(255, 255, 255, 0.18); }
  .tl { top: 24px; left: 24px; border-top-width: 1px; border-left-width: 1px; }
  .tr { top: 24px; right: 24px; border-top-width: 1px; border-right-width: 1px; }
  .bl { bottom: 24px; left: 24px; border-bottom-width: 1px; border-left-width: 1px; }
  .br { bottom: 24px; right: 24px; border-bottom-width: 1px; border-right-width: 1px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .word { display: flex; align-items: center; gap: 14px; font-size: 22px; letter-spacing: 0.22em; }
  .eyebrow { font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #737373; }
  .body { display: flex; flex: 1; align-items: center; justify-content: space-between; gap: 40px; }
  .headline { font-size: 72px; line-height: 0.98; letter-spacing: -0.035em; }
  .accent { color: #E04D26; }
  .line { margin-top: 24px; font-size: 22px; color: #A3A3A3; }
  .marks { display: flex; flex-direction: column; gap: 14px; }
  .disc { display: flex; align-items: center; justify-content: center; width: 76px; height: 76px; border-radius: 38px; font-size: 36px; color: #FFFFFF; }
  .honesty { font-size: 16px; letter-spacing: 0.04em; color: #737373; }
</style>
</head>
<body>
<div class="frame">
  <div class="crop tl"></div><div class="crop tr"></div><div class="crop bl"></div><div class="crop br"></div>
  <div class="top">
    <div class="word">
      <svg width="26" height="32" viewBox="0 0 266 322" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 262 H230" stroke="#FFFFFF" fill="none" stroke-width="30" stroke-linecap="round"/>
        <path d="M52 214 C 104 214, 132 142, 190 108" stroke="#FFFFFF" fill="none" stroke-width="30" stroke-linecap="round"/>
        <circle cx="206" cy="88" r="30" fill="#E04D26"/>
      </svg>
      MITOSHI
    </div>
    <div class="eyebrow">Prediction markets on Tempo</div>
  </div>
  <div class="body">
    <div>
      <div class="headline">Call where a price</div>
      <div class="headline accent">closes.</div>
      <div class="line">BTC, ETH, SOL and US stocks. One passkey, one tap.</div>
    </div>
    <div class="marks">
      <div class="disc" style="background:#F7931A">B</div>
      <div class="disc" style="background:#CC0000">T</div>
      <div class="disc" style="background:#76B900">N</div>
    </div>
  </div>
  <div class="honesty">Tempo testnet · test pathUSD</div>
</div>
</body>
</html>
