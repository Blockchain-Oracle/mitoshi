// Passkeys inside the Android web view (D-227, MOBILE; docs/specs/mobile.md D.5 spike X14). Dependencies as Android's
// "Authenticate users with WebView" guide lists them: androidx.webkit >= 1.12 carries setWebAuthenticationSupport
// (1.14.0 is also react-native-webview 13.16.1's own pin), and Credential Manager with its Play services provider.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'xyz.mitoshi'
version = '1.0.0'

android {
  namespace "xyz.mitoshi.webviewwebauthn"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.webkit:webkit:1.14.0"
  implementation "androidx.credentials:credentials:1.6.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
}
