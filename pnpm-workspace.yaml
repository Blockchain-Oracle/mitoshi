packages:
  - web
  - contracts
  - mobile
  - packages/*
  - services/*
  - scripts

autoInstallPeers: true
strictPeerDependencies: false
catalogMode: strict

allowBuilds:
  bufferutil: false
  esbuild: true
  keccak: false
  sharp: true
  utf-8-validate: false

# Web, services and shared packages.
catalog:
  next: 16.3.6
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": ^19
  "@types/react-dom": ^19
  "@types/node": ^24
