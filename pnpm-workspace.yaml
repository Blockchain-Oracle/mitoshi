packages:
  - web
  - contracts
  - mobile
  - packages/*
  - services/*
  - scripts

autoInstallPeers: true
strictPeerDependencies: false
catalogMode: strict

# Lighthouse's trace engine (dev tooling: @lhci/cli) depends on these as "latest", so every lockfile change would take
# whatever was published last; pinned to the versions the lockfile already held (2026-10-10: a fresh legacy-javascript
# 0.0.2/0.0.3 appeared two days after 0.0.1's 18-month quiet — not taken unreviewed).
overrides:
  "@paulirish/trace_engine>legacy-javascript": 0.0.1
  "@paulirish/trace_engine>third-party-web": 0.30.0

allowBuilds:
  bufferutil: false
  esbuild: true
  keccak: false
  "@reown/appkit": false
  sharp: true
  utf-8-validate: false

# Web, services and shared packages.
catalog:
  next: 16.3.6
  web-vitals: ^6.2.2
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": ^19
  "@types/react-dom": ^19
  "@types/node": ^24
  typescript: ^5.9.3
  zod: ^4.1.0
  # Marks server modules so a client import fails the build (secrets never reach the browser).
  server-only: ^0.0.1
  viem: ^2.56.9
  wagmi: ^3.7.7
  # WalletConnect for phones with no injected wallet (C.3.1: required for bridge-in); loaded only on demand.
  "@walletconnect/ethereum-provider": ^2.21.1
  "@wagmi/core": ^3.6.5
  # Exact pin (C.1.3): 0.18.5 was published with an unresolved `hono@catalog:` dependency and cannot install.
  accounts: 0.18.4
  ox: ~0.14.45
  mppx: ^0.10.1
  tidx.ts: ^0.1.2
  "@tanstack/react-query": ^5.90.0
  lightweight-charts: ^5.2.0
  motion: ^13.4.0
  "@base-ui/react": ^1.8.0
  lucide-react: ^1.48.0
  # Masayume's class utilities (web/src/lib/utils.ts `cn`, cva variants) and its tw-animate import.
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  class-variance-authority: ^0.7.1
  tw-animate-css: ^1.4.0
  "@number-flow/react": ^0.6.2
  # The share card's QR and /download's (S5 L-22, S20; Owarine ecb7565b's pin): MIT, no dependencies, no install scripts.
  qrcode-generator: 2.0.4
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  babel-plugin-react-compiler: ^1.0.0
  postgres: ^3.4.9
  ai: ^7.0.0
  "@ai-sdk/anthropic": ^4.0.0
  "@ai-sdk/openai": ^4.0.0
  "@ai-sdk/google": ^4.0.0
  "@upstash/redis": ^1.39.0
  # Coolify Redis over TCP (D-061 replaces Upstash); atomic GETDEL/SET NX for the accounts SDK Kv.
  redis: ^6.2.0
  idb-keyval: ^6.3.0
  rettiwt-api: 7.1.3
  sharp: 0.34.5
  opentype.js: 1.3.4
  ws: ^8.21.0
  vitest: ^4.1.0
  tsx: ^4.20.0
  "@playwright/test": ^1.63.0
  "@axe-core/playwright": ^4.13.0
  "@lhci/cli": ^0.15.1
  "@layerzerolabs/oapp-evm": ^0.4.1
  "@layerzerolabs/oapp-evm-upgradeable": ^0.1.3
  "@layerzerolabs/oft-evm": ^4.0.1
  "@layerzerolabs/oft-evm-upgradeable": ^4.0.2
  "@layerzerolabs/lz-evm-protocol-v2": ^3.0.168
  "@layerzerolabs/lz-evm-messagelib-v2": ^3.0.168
  "@layerzerolabs/lz-evm-v1-0.7": ^3.0.168
  "@layerzerolabs/test-devtools-evm-foundry": ^8.0.1
  solidity-bytes-utils: ^0.8.4
  obscenity: 0.4.6
  '@dicebear/core': 9.4.3
  '@dicebear/notionists': 9.4.2

# Expo SDK 57 pins for mobile/ (kept apart from the web's React; plan Appendix D.1). Versions are SDK 57's
# bundledNativeModules.json for expo 57.0.27 (2026-10-06; 57.0.28 landed the day of this pin, inside the release-age gate).
catalogs:
  mobile:
    expo: 57.0.27
    react: 19.2.3
    react-native: 0.86.3
    expo-router: ~57.0.22
    react-native-webview: 13.16.1
    expo-constants: ~57.0.21
    expo-file-system: ~57.0.7
    expo-font: ~57.0.4
    expo-network: ~57.0.2
    expo-sharing: ~57.0.22
    expo-splash-screen: ~57.0.9
    expo-status-bar: ~57.0.1
    expo-system-ui: ~57.0.4
    react-native-safe-area-context: ~5.7.0
    # The brand faces for the app's one native screen (offline), as Agari and Owarine load them.
    "@expo-google-fonts/inter": ^0.4.2
    "@expo-google-fonts/jetbrains-mono": ^0.4.1
    "@expo-google-fonts/sora": ^0.4.2

patchedDependencies:
  accounts@0.18.4: patches/accounts@0.18.4.patch
