  accounts: ~0.18.4
  ox: ~0.14.45
  mppx: ^0.10.1
  tidx.ts: ^0.1.2
  "@tanstack/react-query": ^5.90.0
  lightweight-charts: ^5.2.0
  motion: ^13.4.0
  "@base-ui/react": ^1.8.0
  lucide-react: ^1.48.0
  "@number-flow/react": ^0.6.2
  tailwindcss: ^4.1.0
