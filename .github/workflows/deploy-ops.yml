name: deploy-ops
on:
  push:
    branches: [main]
    paths: ["services/ops/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/deploy-ops.yml"]
  workflow_dispatch:
    inputs:
      network:
        description: testnet or mainnet
        required: true
        default: testnet

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mainnet deploys need the owner's go: they run only by hand with network=mainnet.
    if: github.event_name == 'push' || inputs.network == 'testnet' || inputs.network == 'mainnet'
    env:
      NETWORK: ${{ inputs.network || 'testnet' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config "services/ops/fly.${NETWORK}.toml" --dockerfile services/ops/Dockerfile .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
