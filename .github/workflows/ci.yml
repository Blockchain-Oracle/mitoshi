name: ci
on:
  push:
    branches: [main, "integration/**", "stage/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm typecheck
      - run: pnpm invariants
      - run: pnpm codegen:check
      - run: pnpm test
      - run: pnpm build
      # Route budgets (plan §3.1, D-071): gzip first-load JS per route from the build manifests; fails over budget.
      - run: pnpm perf:budgets
