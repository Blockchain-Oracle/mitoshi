# Fly app for ops on testnet (plan C.6). Secrets are set with `fly secrets set` (names in infra/secrets.md).
app = "cwf-ops-testnet"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NETWORK = "testnet"
  OPS_HTTP_PORT = "8080"
  # Actors read and plan but sign nothing until DRY_RUN is set to 0 per actor rollout.
  DRY_RUN = "1"

[[mounts]]
  source = "cwf_ops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"
