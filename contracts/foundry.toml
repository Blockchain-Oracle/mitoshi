# Plan D-054 (D45) / Appendix C.1.5. Default profile = Tempo; `evm` = Robinhood Chain + Base Sepolia side.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out/tempo"
libs = ["lib", "node_modules"]
network = "tempo"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
skip = ["src/robinhood/**", "src/transit/**", "test/evm/**"]
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../packages/core/src" },
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "../packages/markets/src/v4" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false

[profile.evm]
out = "out/evm"
network = "ethereum"
evm_version = "cancun"
skip = ["src/engine/**", "src/products/**", "src/fair/**", "src/stocks/**", "src/themes/**", "src/launch/**", "src/v4/**", "test/tempo/**", "test/fork/v4/**", "test/engine/**", "test/products/**", "test/spikes/**", "test/fork/*.fork.t.sol", "script/DeployEngine.s.sol", "script/EnsureEngine.s.sol", "script/RegisterSeries.s.sol", "script/ReserveNodes.s.sol", "script/lib/EngineCheck.sol", "script/DeployEventVault.s.sol", "script/DeployMarketMakerVault.s.sol"]

[profile.ci]
fuzz = { runs = 10000 }

[profile.invariant]
invariant = { runs = 256, depth = 500 }

[rpc_endpoints]
tempo = "${TEMPO_RPC_HTTP_URL}"
moderato = "https://rpc.moderato.tempo.xyz"
robinhood = "${RH_RPC_HTTP_URL}"
robinhood_testnet = "${RH_TESTNET_RPC_HTTP_URL}"
base_sepolia = "https://sepolia.base.org"
