# Plan D-054 (D45) / Appendix C.1.5. One profile: Tempo. D-231 removed the bridge's `evm` profile (Robinhood Chain +
# Base Sepolia side) with the bridge.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out/tempo"
libs = ["lib", "node_modules"]
network = "tempo"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "../packages/core/src" },
  { access = "read", path = "./test/fixtures" },
  { access = "read", path = "../packages/markets/src/v4" },
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10000 }

[profile.invariant]
invariant = { runs = 256, depth = 500 }

[rpc_endpoints]
tempo = "${TEMPO_RPC_HTTP_URL}"
moderato = "https://rpc.moderato.tempo.xyz"
